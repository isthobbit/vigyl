name: Offline proof

# Proves `jensec scan all --offline` works with no network at all: the data is
# synced in one container, then the scan runs in a second container started
# with --network none.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-proof:
    name: Scan with --network none
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build -f test/offline/Dockerfile -t jensec-offline .

      - name: Sync offline data (network allowed)
        run: |
          docker volume create jensec-data
          docker run --rm -v jensec-data:/root/.vigyl jensec-offline \
            jensec offline sync --ecosystems npm,PyPI

      - name: Scan the fixture (no network)
        run: |
          docker run --rm --network none -v jensec-data:/root/.vigyl jensec-offline \
            offline-proof
