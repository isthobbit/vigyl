name: Security Scan (jensec)

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  security-scan:
    name: jensec · vigyl Security Scan
    runs-on: ubuntu-latest

    permissions:
      # Needed to upload SARIF results to GitHub Code Scanning (future)
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          # Releases and CI build with the newest Go 1.27 patch release, which
          # carries the latest standard library security fixes.
          go-version: "1.27"
          check-latest: true

      # ── Install dependencies ─────────────────────────────────────────────────

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin
          gitleaks version

      - name: Install Semgrep
        run: |
          pip3 install semgrep --quiet
          semgrep --version

      # Pinned and checksum-verified, the same versions as the offline proof
      # (test/offline/Dockerfile).
      - name: Install Trivy and OSV-Scanner
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
          OSV_VERSION: "2.4.0"
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C /usr/local/bin trivy
          curl -sSfL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
          trivy --version
          osv-scanner --version

      # ── Build jensec from source ─────────────────────────────────────────────
      - name: Build jensec
        run: |
          go build -o /usr/local/bin/jensec ./cmd/jensec
          jensec --version

      # ── Run scans ────────────────────────────────────────────────────────────

      - name: Run secrets scan
        run: jensec scan secrets . --fail-on high --json --output secrets-report.json

      - name: Run SAST scan
        run: jensec scan sast . --fail-on high --json --output sast-report.json

      # Fails on CRITICAL dependency vulnerabilities that have a fix. Lower
      # ones are reported in deps-report.json without failing the build.
      - name: Run dependency scan
        run: jensec scan deps . --fail-on-deps critical --fail-on-deps-fixable --json --output deps-report.json

      # ── Upload reports as artifacts ──────────────────────────────────────────

      - name: Upload scan reports
        if: always() # upload even if a scan step fails
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: jensec-reports
          path: |
            secrets-report.json
            sast-report.json
            deps-report.json
          retention-days: 30